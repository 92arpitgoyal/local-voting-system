<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'media',theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui','sans-serif']}}}}</script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white font-sans antialiased">

<nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between p-4">
    <a href="#" class="flex items-center gap-2 text-xl font-semibold"><svg class="w-7 h-7" viewBox="0 0 28 28" fill="none" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="14" r="2.5" fill="#534AB7"/><path d="M6 9.5a4.5 4.5 0 0 1 0 9" stroke="#534AB7" stroke-width="2"/><path d="M6 5.5a8.5 8.5 0 0 1 0 17" stroke="#7F77DD" stroke-width="2" opacity=".75"/><path d="M6 1.5a12.5 12.5 0 0 1 0 25" stroke="#AFA9EC" stroke-width="2" opacity=".6"/></svg><span>Team<span class="text-[#534AB7] dark:text-[#AFA9EC]">-Echo</span></span></a>
    <div class="flex items-center gap-3">
      <span class="hidden sm:inline text-sm text-gray-500 dark:text-gray-400">Sprint 24 retro</span>
      <button class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">Invite team</button>
    </div>
  </div>
</nav>

<main class="max-w-screen-xl mx-auto p-4">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-2xl font-bold">Sprint 24 retro</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Add cards, then vote on what to discuss.</p>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded dark:bg-blue-900 dark:text-blue-300">Phase: Write</span>
      <button class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700">Next phase</button>
    </div>
  </div>

  <div id="board" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

  <div class="mt-6 p-4 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700">
    <h2 class="text-lg font-semibold mb-3">Action items</h2>
    <ul id="actions" class="space-y-2 text-sm"></ul>
    <p id="actions-empty" class="text-sm text-gray-500 dark:text-gray-400">No action items yet. Click “Make action” on any card.</p>
  </div>
</main>

<script>
const cols=[
 {id:'well',title:'Went well',tone:'green'},
 {id:'better',title:'To improve',tone:'red'},
 {id:'ideas',title:'Ideas',tone:'yellow'}
];
const tones={green:'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300',red:'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300',yellow:'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300'};
const cards={well:[{t:'Shipped the onboarding flow on time',v:3}],better:[{t:'Too many unplanned tasks mid-sprint',v:5},{t:'Standups run long',v:1}],ideas:[{t:'Try async standups twice a week',v:2}]};
const actions=[];
const board=document.getElementById('board');

function render(){
  board.innerHTML='';
  cols.forEach(c=>{
    const col=document.createElement('section');
    col.className='p-4 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700';
    col.innerHTML=`<div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">${c.title}</h2><span class="text-xs font-medium px-2.5 py-0.5 rounded ${tones[c.tone]}">${cards[c.id].length}</span></div><div class="space-y-3"></div>
    <div class="mt-3 flex gap-2"><input type="text" placeholder="Add a card" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"><button class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 shrink-0">Add</button></div>`;
    const list=col.querySelector('.space-y-3');
    cards[c.id].forEach((card,i)=>{
      const el=document.createElement('div');
      el.className='p-3 bg-gray-50 border border-gray-200 rounded-lg dark:bg-gray-700 dark:border-gray-600';
      el.innerHTML=`<p class="text-sm mb-2"></p><div class="flex items-center justify-between"><button class="vote inline-flex items-center gap-1 text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-xs px-3 py-1.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-600">▲ ${card.v}</button><button class="act text-xs font-medium text-blue-700 hover:underline dark:text-blue-500">Make action</button></div>`;
      el.querySelector('p').textContent=card.t;
      el.querySelector('.vote').onclick=()=>{card.v++;render()};
      el.querySelector('.act').onclick=()=>{actions.push(card.t);renderActions()};
      list.appendChild(el);
    });
    const input=col.querySelector('input'),btn=col.querySelector('button.shrink-0');
    const add=()=>{const t=input.value.trim();if(!t)return;cards[c.id].push({t,v:0});render()};
    btn.onclick=add;input.onkeydown=e=>{if(e.key==='Enter')add()};
    board.appendChild(col);
  });
}
function renderActions(){
  const ul=document.getElementById('actions');ul.innerHTML='';
  document.getElementById('actions-empty').style.display=actions.length?'none':'block';
  actions.forEach(a=>{
    const li=document.createElement('li');
    li.className='flex items-center gap-2';
    li.innerHTML='<input type="checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500"><span></span>';
    li.querySelector('span').textContent=a;ul.appendChild(li);
  });
}
render();renderActions();
</script>
</body>
</html>
