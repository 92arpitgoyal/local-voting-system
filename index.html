<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team-Echo | Team tools that remember</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white font-sans antialiased">
<header id="site-header"></header>
<script src="js/site.js"></script>

<main class="max-w-screen-xl mx-auto px-4 pb-20">
  <section class="text-center py-12 sm:py-16 max-w-2xl mx-auto">
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Team tools that remember</h1>
    <p class="mt-3 text-lg text-gray-500 dark:text-gray-400">Run your retros and decisions in one place, so what your team learns is never forgotten.</p>
  </section>

  <section aria-labelledby="available">
    <h2 id="available" class="text-xl font-semibold mb-4">Available now</h2>
    <div id="available-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section aria-labelledby="soon" class="mt-12">
    <h2 id="soon" class="text-xl font-semibold mb-4">Coming soon</h2>
    <div id="soon-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
  </section>
</main>

<script>
const card = (t, live) => {
  const body = `<div class="w-12 h-12 rounded-lg flex items-center justify-center ${t.tone}">${toolIcon(t)}</div>
    <div class="mt-4 flex items-center gap-2"><h3 class="text-lg font-semibold">${t.name}</h3>
      <span class="text-xs font-medium px-2 py-0.5 rounded bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300">${t.kind}</span></div>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">${t.text}</p>
    ${live ? '<span class="mt-4 inline-block text-sm font-medium text-blue-700 dark:text-blue-500">Open tool →</span>' : ""}`;
  const base = "block p-5 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700";
  return live ? `<a href="${t.href}" class="${base} hover:bg-gray-50 dark:hover:bg-gray-700">${body}</a>` : `<div class="${base} opacity-70">${body}</div>`;
};
document.getElementById("available-grid").innerHTML = TOOLS.filter(t => t.href).map(t => card(t, true)).join("");
document.getElementById("soon-grid").innerHTML = TOOLS.filter(t => !t.href).map(t => card(t, false)).join("");
</script>
</body>
</html>
